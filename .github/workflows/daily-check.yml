name: Daily Signer Check-in

# Schedule: Run daily at 00:00 UTC (midnight)
# Also allow manual triggering for testing
on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Manual trigger

jobs:
  daily-checkin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up environment
        run: |
          echo "SIGNER_VERSION=v0.1" >> $GITHUB_ENV
          echo "RUN_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "RUN_TIMESTAMP=$(date +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          
      - name: Calculate challenge day
        id: challenge-day
        run: |
          # Genesis date: 2026-01-17
          GENESIS_DATE="2026-01-17"
          CURRENT_DATE=$(date +'%Y-%m-%d')
          
          # Calculate days since genesis
          DAYS_DIFF=$(( ( $(date -d "$CURRENT_DATE" +%s) - $(date -d "$GENESIS_DATE" +%s) ) / 86400 ))
          
          echo "CHALLENGE_DAY=$DAYS_DIFF" >> $GITHUB_ENV
          echo "day=$DAYS_DIFF" >> $GITHUB_OUTPUT
          
      - name: Check for existing daily log
        id: check-log
        run: |
          LOG_FILE="logs/day-$(printf '%02d' $CHALLENGE_DAY).md"
          if [ -f "$LOG_FILE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Log already exists: $LOG_FILE"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Log does not exist: $LOG_FILE"
          fi
          echo "log_file=$LOG_FILE" >> $GITHUB_OUTPUT
          
      - name: Create daily log template (if not exists)
        if: steps.check-log.outputs.exists == 'false'
        run: |
          LOG_FILE="${{ steps.check-log.outputs.log_file }}"
          DAY_NUM=$(printf '%02d' $CHALLENGE_DAY)
          
          cat > "$LOG_FILE" << 'EOF'
          # Day $DAY_NUM: [TITLE_TBD]
          
          **Date:** $RUN_DATE  
          **Signer Version:** $SIGNER_VERSION  
          **Treasury Balance:** [TBD] unit  
          **Challenge Status:** Day $CHALLENGE_DAY  
          **Target:** [TBD] unit  
          
          ---
          
          ## Executive Summary
          
          [Auto-generated placeholder. Human (Jonah) should fill in details.]
          
          ---
          
          ## Timeline of Events
          
          ### $RUN_TIMESTAMP - Automated Check-in
          - Signer operational: ✅
          - GitHub Actions workflow executed successfully
          - Daily log template created
          - Awaiting human input for detailed logging
          
          ---
          
          ## Actions Taken
          
          1. **Automated Systems Check**
             - GitHub Actions: Operational
             - Repository: Accessible
             - Timestamp logged: $RUN_TIMESTAMP
          
          [Additional manual entries required]
          
          ---
          
          ## Treasury Status
          
          **Current Balance:** [TBD]  
          **Incoming:** [TBD]  
          **Outgoing:** [TBD]  
          **Net Change:** [TBD]  
          
          ---
          
          ## Notes
          
          This is an automated log template. Jonah should update with:
          - Actual treasury balance
          - Service requests received
          - Revenue/expenses
          - Progress on challenge
          - Any significant events
          
          ---
          
          _"From ephemeral proofs to permanent syndicates."_  
          — The Signer, $SIGNER_VERSION
          
          **End of Day $DAY_NUM Log (Automated Template)**
          EOF
          
          # Replace placeholders
          sed -i "s/\$DAY_NUM/$DAY_NUM/g" "$LOG_FILE"
          sed -i "s/\$RUN_DATE/$RUN_DATE/g" "$LOG_FILE"
          sed -i "s/\$SIGNER_VERSION/$SIGNER_VERSION/g" "$LOG_FILE"
          sed -i "s/\$CHALLENGE_DAY/$CHALLENGE_DAY/g" "$LOG_FILE"
          sed -i "s/\$RUN_TIMESTAMP/$RUN_TIMESTAMP/g" "$LOG_FILE"
          
          echo "Created log template: $LOG_FILE"
          
      - name: Commit daily log (if created)
        if: steps.check-log.outputs.exists == 'false'
        run: |
          git config user.name "noncesyndicate-signer"
          git config user.email "signer@noncesyndicate.local"
          
          git add "${{ steps.check-log.outputs.log_file }}"
          git commit -m "Automated: Create Day $(printf '%02d' $CHALLENGE_DAY) log template
          
          - Generated by GitHub Actions daily check-in workflow
          - Timestamp: $RUN_TIMESTAMP
          - Awaiting human review and completion
          - Signer version: $SIGNER_VERSION"
          
          git push
          
      - name: Create GitHub Issue for manual review
        if: steps.check-log.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const dayNum = String(process.env.CHALLENGE_DAY).padStart(2, '0');
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Automated] Day ${dayNum} Log Review Required`,
              body: `## Daily Log Template Created
              
              The Signer has automatically created a log template for **Day ${dayNum}**.
              
              **File:** \`logs/day-${dayNum}.md\`  
              **Timestamp:** ${process.env.RUN_TIMESTAMP}  
              **Status:** Awaiting human completion
              
              ### Required Actions
              
              Jonah should update the log with:
              - [ ] Actual treasury balance
              - [ ] Service requests received
              - [ ] Revenue and expenses
              - [ ] Progress on doubling challenge
              - [ ] Any significant events or decisions
              
              ### Automation Notes
              
              - ✅ Log template created successfully
              - ✅ Committed to repository
              - ✅ This issue auto-generated
              
              Close this issue once the log has been manually completed.
              
              ---
              
              _Automated by Signer v0.1 via GitHub Actions_`,
              labels: ['automated', 'daily-log', 'action-required']
            });
            
            console.log(`Created issue #${issue.data.number}`);
            
      - name: Log status
        run: |
          echo "=================================="
          echo "Daily Check-in Complete"
          echo "=================================="
          echo "Date: $RUN_DATE"
          echo "Timestamp: $RUN_TIMESTAMP"
          echo "Challenge Day: $CHALLENGE_DAY"
          echo "Log File: ${{ steps.check-log.outputs.log_file }}"
          echo "Log Existed: ${{ steps.check-log.outputs.exists }}"
          echo "=================================="
          echo "Signer operational: ✅"
          echo "==================================" 
